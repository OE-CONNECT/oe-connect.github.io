<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Projects – OE-CONNECT</title>

  <!-- Bootstrap (kept for consistency with other pages) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <h1>Old English Research Projects</h1>
    <p>An overview of research projects related to Old English Studies at continental European institutions. 
      We hope this overview will not only showcase ongoing research but will also facilitate finding research partners for European funding schemes.</p>

    <!-- Filters -->
    <div class="filters-bar">
      <div class="filter-group">
        <label for="filterCountry">Country</label>
        <select id="filterCountry">
          <option value="">All countries</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterInstitution">Institution</label>
        <select id="filterInstitution">
          <option value="">All institutions</option>
        </select>
      </div>

      <div class="filter-group" style="flex-grow: 1; min-width: 220px;">
        <label for="searchBox">Search</label>
        <input type="text" id="searchBox" placeholder="Search in all fields…" style="width: 100%; padding: 0.35rem 0.6rem; border: 1px solid #8B1A1A; background: #F5E8C7; font-family: inherit;">
      </div>
    </div>

    <!-- Results -->
    <div id="projectsContainer">
      <p>Loading projects…</p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const CSV_URL = 'assets/data/projects.csv';
    let allProjects = [];

    // ---------- Load data ----------
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allProjects = results.data.filter(row => row.Title && row.Title.trim() !== '');
        populateFilterOptions();
        render();
      },
      error: function(err) {
        document.getElementById('projectsContainer').innerHTML = '<p>Could not load projects.csv</p>';
        console.error(err);
      }
    });

    // ---------- Filters ----------
    document.getElementById('filterCountry').addEventListener('change', render);
    document.getElementById('filterInstitution').addEventListener('change', render);
    document.getElementById('searchBox').addEventListener('input', render);

    function populateFilterOptions() {
      // Countries (split by semicolon)
      const countrySet = new Set();
      allProjects.forEach(p => {
        if (p.Countries) {
          p.Countries.split(';').forEach(c => {
            const cleaned = c.trim();
            if (cleaned) countrySet.add(cleaned);
          });
        }
      });
      fillSelect('filterCountry', [...countrySet].sort());

      // Institutions (split by semicolon)
      const institutionSet = new Set();
      allProjects.forEach(p => {
        if (p.Institutions) {
          p.Institutions.split(';').forEach(i => {
            const cleaned = i.trim();
            if (cleaned) institutionSet.add(cleaned);
          });
        }
      });
      fillSelect('filterInstitution', [...institutionSet].sort());
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id);
      // Keep the first "All ..." option
      values.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    function getFiltered() {
      const country = document.getElementById('filterCountry').value;
      const institution = document.getElementById('filterInstitution').value;
      const search = document.getElementById('searchBox').value.toLowerCase().trim();

      return allProjects.filter(p => {
        // Country filter
        if (country) {
          const countries = (p.Countries || '').split(';').map(c => c.trim());
          if (!countries.includes(country)) return false;
        }

        // Institution filter
        if (institution) {
          const institutions = (p.Institutions || '').split(';').map(i => i.trim());
          if (!institutions.includes(institution)) return false;
        }

        // Search across all fields
        if (search) {
          const searchable = [
            p.Title,
            p.Description,
            p.Institutions,
            p.Countries,
            p.Funding,
            p.StartYear,
            p.EndYear
          ].join(' ').toLowerCase();

          if (!searchable.includes(search)) return false;
        }

        return true;
      });
    }

    // ---------- Render ----------
    function render() {
      const filtered = getFiltered();

      const ongoing = filtered.filter(p => (p.Status || '').toLowerCase() === 'ongoing');
      const finished = filtered.filter(p => (p.Status || '').toLowerCase() === 'finished');

      let html = '';

      // Ongoing section
      html += `<h2 class="group-heading">Ongoing Research Projects (${ongoing.length})</h2>`;
      if (ongoing.length === 0) {
        html += '<p>No ongoing projects match the current filters.</p>';
      } else {
        ongoing.forEach(p => html += renderCard(p));
      }

      // Finished section
      html += `<h2 class="group-heading">Finished Research Projects (${finished.length})</h2>`;
      if (finished.length === 0) {
        html += '<p>No finished projects match the current filters.</p>';
      } else {
        finished.forEach(p => html += renderCard(p));
      }

      document.getElementById('projectsContainer').innerHTML = html;
    }

    function renderCard(p) {
      // Logo
      const logoSrc = p.Logo && p.Logo.trim() !== ''
        ? p.Logo
        : 'assets/images/icon.project.png';   // ← default icon

      // Smart title with years
      let titleText = p.Title || 'Untitled project';
      if (p.StartYear && p.EndYear) {
        titleText += ` (${p.StartYear}–${p.EndYear})`;
      } else if (p.StartYear) {
        titleText += ` (${p.StartYear}–)`;
      }

      // Institutions with bullet separator
      const institutions = (p.Institutions || '')
        .split(';')
        .map(i => i.trim())
        .filter(Boolean)
        .join(' • ');

      // Website link
      const websiteLink = p.Website
        ? `<p class="project-website"><a href="${p.Website}" target="_blank">Link to project website</a></p>`
        : '';

      return `
        <div class="project-card">
          <div class="project-left">
            <img src="${logoSrc}" alt="Project logo" class="project-logo">
          </div>
          <div class="project-right">
            <h3>${titleText}</h3>
            <p>${p.Description || ''}</p>
            ${p.Funding ? `<p><strong>Funded by:</strong> ${p.Funding}</p>` : ''}
            ${institutions ? `<p><strong>Institutions:</strong> ${institutions}</p>` : ''}
            ${websiteLink}
          </div>
        </div>
      `;
    }
  </script>

  <style>
    /* Extra styles specific to this page (can later be moved to style.css) */
    .group-heading {
      margin-top: 2.8rem;
      margin-bottom: 1.4rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #8B1A1A;
      color: #8B1A1A;
    }

    .project-card {
      display: flex;
      gap: 1.8rem;
      margin-bottom: 2.2rem;
      padding-bottom: 1.8rem;
      border-bottom: 1px solid #d4c4a8;
    }

    .project-left {
      flex-shrink: 0;
      width: 200px;
    }

    .project-logo {
      max-width: 200px;
      height: auto;
      display: block;
    }

    .project-right h3 {
      margin-top: 0;
      margin-bottom: 0.6rem;
      color: #2C1A0E;
    }

    .project-website {
      margin-top: 1rem;
      font-weight: bold;
    }

    .project-website a {
      font-size: 1.05rem;
    }

    @media (max-width: 700px) {
      .project-card {
        flex-direction: column;
      }
      .project-left {
        width: 100%;
      }
      .project-logo {
        max-width: 160px;
      }
    }
  </style>
</body>
</html>
