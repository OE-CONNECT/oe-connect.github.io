<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OE-CONNECT: Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <!-- Navbar is loaded here by assets/js/main.js. -->
  <div id="navbar-placeholder"></div>

  <main>
    <header>
      <h1>Events</h1>
      <p>Here is an overview of Old English events (conferences; summer schools; exhibitions, etc.) relating to Old English at European continental institutions.</p>
    </header>

    <div class="events-layout">
      <div class="events-main" id="eventsContainer">
        <p>Loading events…</p>
      </div>

      <aside class="events-sidebar">
        <div class="filter-group">
          <h3>Format</h3>
          <label><input type="checkbox" class="format-filter" value="On campus" checked> On campus</label>
          <label><input type="checkbox" class="format-filter" value="Online" checked> Online</label>
          <label><input type="checkbox" class="format-filter" value="Hybrid" checked> Hybrid</label>
        </div>

        <div class="filter-group">
          <h3>Country</h3>
          <div id="countryFilters"><p>Loading countries…</p></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer is loaded here by assets/js/main.js. -->
  <div id="footer-placeholder"></div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkYM8BFpPiqinOeZJchhw4evXCPQGpp-vNO0cdlO28KcKwDaKnEwUgemcP-EwhYnc8FrROyw8BOtss/pub?gid=646996331&single=true&output=csv';
    let allEvents = [];

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allEvents = results.data;
        renderCountryFilters();
        renderEvents();
      },
      error: function(err) {
        document.getElementById('eventsContainer').innerHTML = '<p>Could not load events.csv</p>';
        console.error(err);
      }
    });

    document.querySelectorAll('.format-filter').forEach(el => {
      el.addEventListener('change', renderEvents);
    });

    function getCountry(ev) {
      return (ev.LocationCountry || ev.locationCountry || '').trim();
    }

    function renderCountryFilters() {
      const countries = [...new Set(allEvents.map(getCountry).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const container = document.getElementById('countryFilters');

      if (!countries.length) {
        container.innerHTML = '<p>No countries available.</p>';
        return;
      }

      container.innerHTML = countries.map(country => `
        <label><input type="checkbox" class="country-filter" value="${country}" checked> ${country}</label>
      `).join('');

      container.querySelectorAll('.country-filter').forEach(el => {
        el.addEventListener('change', renderEvents);
      });
    }

    function parseChronodate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      const day = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const year = parseInt(parts[2], 10);
      return new Date(year, month - 1, day);
    }

    function sortByChronodate(events) {
      return events.sort((a, b) => {
        const dateA = parseChronodate(a.Chronodate);
        const dateB = parseChronodate(b.Chronodate);
        if (!dateA) return 1;
        if (!dateB) return -1;
        return dateB - dateA;
      });
    }

    function renderEvents() {
      const activeFormats = Array.from(document.querySelectorAll('.format-filter:checked')).map(cb => cb.value);
      const activeCountries = Array.from(document.querySelectorAll('.country-filter:checked')).map(cb => cb.value);

      const filtered = allEvents.filter(ev => {
        if (ev.APPROVED !== 'TRUE') return false;
        if (ev.Format && !activeFormats.includes(ev.Format)) return false;
        const country = getCountry(ev);
        if (country && !activeCountries.includes(country)) return false;
        return true;
      });

      const upcomingEvents = filtered.filter(e => e.Status === 'upcoming');
      const pastEvents = filtered.filter(e => e.Status === 'past');
      const oeUpcoming = sortByChronodate(upcomingEvents.filter(e => e.Group === 'OE-CONNECT'));
      const otherUpcoming = sortByChronodate(upcomingEvents.filter(e => e.Group === 'Other'));
      const oePast = sortByChronodate(pastEvents.filter(e => e.Group === 'OE-CONNECT'));
      const otherPast = sortByChronodate(pastEvents.filter(e => e.Group === 'Other'));

      let html = '';
      html += `<h1 class="status-heading">Upcoming events (${upcomingEvents.length})</h1>`;
      html += `<h2 class="group-heading" style="text-align: center;">OE-CONNECT events</h2>`;
      html += oeUpcoming.length ? oeUpcoming.map(renderCard).join('') : '<p>No matching OE-CONNECT upcoming events.</p>';
      html += `<h2 class="group-heading" style="text-align: center;">Other Old English events</h2>`;
      html += otherUpcoming.length ? otherUpcoming.map(renderCard).join('') : '<p>No matching other upcoming events.</p>';
      html += `<h1 class="status-heading">Past events (${pastEvents.length})</h1>`;
      html += `<h2 class="group-heading" style="text-align: center;">OE-CONNECT events</h2>`;
      html += oePast.length ? oePast.map(renderCard).join('') : '<p>No matching OE-CONNECT past events.</p>';
      html += `<h2 class="group-heading" style="text-align: center;">Other Old English events</h2>`;
      html += otherPast.length ? otherPast.map(renderCard).join('') : '<p>No matching other past events.</p>';

      document.getElementById('eventsContainer').innerHTML = html;
    }

    function renderCard(ev) {
      const logoHtml = ev.Logo ? `<img src="${ev.Logo}" alt="Logo" class="event-logo">` : '';
      const links = [];
      if (ev.Website) links.push(`<a href="${ev.Website}" target="_blank">Website</a>`);
      if (ev.CFP) links.push(`<a href="${ev.CFP}" target="_blank">Call for Papers</a>`);
      const location = [ev.LocationCity, getCountry(ev)].filter(Boolean).join(', ');

      return `
        <div class="event-card">
          <div class="event-left">
            <div class="event-year">${ev.Year || ''}</div>
            <div class="event-date">${ev.Date || ''}</div>
            ${logoHtml}
          </div>
          <div class="event-right">
            <h3>${ev.Name || 'Untitled event'}</h3>
            <p>${ev.Description || ''}</p>
            <div class="event-meta">
              ${ev.Organiser ? `<strong>Organiser:</strong> ${ev.Organiser}<br>` : ''}
              ${location ? `<strong>Location:</strong> ${location}<br>` : ''}
              ${ev.Format ? `<strong>Format:</strong> ${ev.Format}` : ''}
            </div>
            ${links.length ? `<div class="event-links">${links.join(' · ')}</div>` : ''}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
