<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OE-CONNECT: Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    /* ===== Events page specific styles ===== */
    .events-layout {
      display: flex;
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .events-main {
      flex: 1;
    }

    .events-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #f8f1e3;
      border: 1px solid #d4c4a8;
      padding: 1.2rem;
      border-radius: 4px;
      height: fit-content;
      position: sticky;
      top: 1rem;
    }

    .events-sidebar h3 {
      margin-top: 0;
      margin-bottom: 0.8rem;
      font-size: 1.1rem;
      color: #8B1A1A;
    }

    .filter-group {
      margin-bottom: 1.5rem;
    }

    .filter-group label {
      display: block;
      margin: 0.3rem 0;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #searchBox {
      width: 100%;
      padding: 0.4rem;
      border: 1px solid #8B1A1A;
      background: #F5E8C7;
      font-family: inherit;
    }

    /* Event card */
    .event-card {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #d4c4a8;
    }

    .event-left {
      width: 150px;
      flex-shrink: 0;
      text-align: center;
    }

    .event-year {
      font-size: 2rem;
      font-weight: bold;
      color: #8B1A1A;
    }

    .event-date {
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }

    .event-logo {
      max-width: 150px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .event-right h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #2C1A0E;
    }

    .event-meta {
      font-size: 0.95rem;
      margin: 0.6rem 0;
      color: #5A4030;
    }

    .event-links a {
      margin-right: 1rem;
    }

    .status-heading {
      margin-top: 2.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid #8B1A1A;
      color: #8B1A1A;
      font-size: 2rem;
    }

    .group-heading {
      margin-top: 1.8rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #d4c4a8;
      color: #2C1A0E;
      font-size: 1.25rem;
    }

    @media (max-width: 800px) {
      .events-layout {
        flex-direction: column;
      }
      .events-sidebar {
        width: 100%;
        position: static;
      }
      .event-card {
        flex-direction: column;
      }
      .event-left {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar is loaded here by assets/js/main.js. -->
  <div id="navbar-placeholder"></div>

  <main>
    <header>
      <h1>Events</h1>
      <div style="text-align: center;">
       <img src="/assets/images/logo.png" alt="Project logo">
      </div>
      <p>Coming soon!</p>
    </header>

    <p>Here we will list Old English events (conferences; summer schools; exhibitions, etc.) relating to Old English at European continental institutions.</p>

 <div class="events-layout">
      <!-- LEFT: list of events -->
      <div class="events-main" id="eventsContainer">
        <p>Loading events…</p>
      </div>

      <!-- RIGHT: compact filters -->
      <aside class="events-sidebar">
        <div class="filter-group">
          <h3>Status</h3>
          <label><input type="radio" name="status" value="all" checked> All</label>
          <label><input type="radio" name="status" value="upcoming"> Upcoming</label>
          <label><input type="radio" name="status" value="past"> Past</label>
        </div>

        <div class="filter-group">
          <h3>Format</h3>
          <label><input type="checkbox" class="format-filter" value="On campus" checked> On campus</label>
          <label><input type="checkbox" class="format-filter" value="Online" checked> Online</label>
          <label><input type="checkbox" class="format-filter" value="Hybrid" checked> Hybrid</label>
        </div>

        <div class="filter-group">
          <h3>Search</h3>
          <input type="text" id="searchBox" placeholder="Search events…">
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer is loaded here by assets/js/main.js. -->
  <div id="footer-placeholder"></div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkYM8BFpPiqinOeZJchhw4evXCPQGpp-vNO0cdlO28KcKwDaKnEwUgemcP-EwhYnc8FrROyw8BOtss/pub?gid=646996331&single=true&output=csv';
    let allEvents = [];

    // Load CSV
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allEvents = results.data;
        renderEvents();
      },
      error: function(err) {
        document.getElementById('eventsContainer').innerHTML = '<p>Could not load events.csv</p>';
        console.error(err);
      }
    });

    // Filters
    document.querySelectorAll('input[name="status"]').forEach(el => {
      el.addEventListener('change', renderEvents);
    });
    document.querySelectorAll('.format-filter').forEach(el => {
      el.addEventListener('change', renderEvents);
    });
    document.getElementById('searchBox').addEventListener('input', renderEvents);

    // Helper function to parse DD/M/YYYY format and return a Date object
    function parseChronodate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      const day = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const year = parseInt(parts[2], 10);
      return new Date(year, month - 1, day);
    }

    // Helper function to sort events by Chronodate (most recent first)
    function sortByChronodate(events) {
      return events.sort((a, b) => {
        const dateA = parseChronodate(a.Chronodate);
        const dateB = parseChronodate(b.Chronodate);
        
        // Handle missing dates - put them at the end
        if (!dateA) return 1;
        if (!dateB) return -1;
        
        // Sort descending (most recent first)
        return dateB - dateA;
      });
    }

    function renderEvents() {
      const statusFilter = document.querySelector('input[name="status"]:checked').value;
      const activeFormats = Array.from(document.querySelectorAll('.format-filter:checked')).map(cb => cb.value);
      const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();

      let filtered = allEvents.filter(ev => {
        if (statusFilter !== 'all' && ev.Status !== statusFilter) return false;
        if (ev.Format && !activeFormats.includes(ev.Format)) return false;
        if (searchTerm) {
          const text = (ev.Name + ' ' + ev.Description).toLowerCase();
          if (!text.includes(searchTerm)) return false;
        }
        return true;
      });

      const upcomingEvents = filtered.filter(e => e.Status === 'upcoming');
      const pastEvents = filtered.filter(e => e.Status === 'past');

      const oeUpcoming = sortByChronodate(upcomingEvents.filter(e => e.Group === 'OE-CONNECT'));
      const otherUpcoming = sortByChronodate(upcomingEvents.filter(e => e.Group === 'Other'));
      const oePast = sortByChronodate(pastEvents.filter(e => e.Group === 'OE-CONNECT'));
      const otherPast = sortByChronodate(pastEvents.filter(e => e.Group === 'Other'));

      let html = '';

      html += `<h1 class="status-heading">Upcoming events (${upcomingEvents.length})</h1>`;
      html += `<h2 class="group-heading" style="text-align: center;">OE-CONNECT events</h2>`;
      if (oeUpcoming.length === 0) {
        html += '<p>No matching OE-CONNECT upcoming events.</p>';
      } else {
        oeUpcoming.forEach(ev => html += renderCard(ev));
      }

      html += `<h2 class="group-heading" style="text-align: center;">Other Old English events</h2>`;
      if (otherUpcoming.length === 0) {
        html += '<p>No matching other upcoming events.</p>';
      } else {
        otherUpcoming.forEach(ev => html += renderCard(ev));
      }

      html += `<h1 class="status-heading">Past events (${pastEvents.length})</h1>`;
      html += `<h2 class="group-heading" style="text-align: center;">OE-CONNECT events</h2>`;
      if (oePast.length === 0) {
        html += '<p>No matching OE-CONNECT past events.</p>';
      } else {
        oePast.forEach(ev => html += renderCard(ev));
      }

      html += `<h2 class="group-heading" style="text-align: center;">Other Old English events</h2>`;
      if (otherPast.length === 0) {
        html += '<p>No matching other past events.</p>';
      } else {
        otherPast.forEach(ev => html += renderCard(ev));
      }

      document.getElementById('eventsContainer').innerHTML = html;
    }

    function renderCard(ev) {
      const logoHtml = ev.Logo
        ? `<img src="${ev.Logo}" alt="Logo" class="event-logo">`
        : '';

      const links = [];
      if (ev.Website) links.push(`<a href="${ev.Website}" target="_blank">Website</a>`);
      if (ev.CFP) links.push(`<a href="${ev.CFP}" target="_blank">Call for Papers</a>`);

      const location = [ev.LocationCity, ev.LocationCountry].filter(Boolean).join(', ');

      return `
        <div class="event-card">
          <div class="event-left">
            <div class="event-year">${ev.Year || ''}</div>
            <div class="event-date">${ev.Date || ''}</div>
            ${logoHtml}
          </div>
          <div class="event-right">
            <h3>${ev.Name || 'Untitled event'}</h3>
            <p>${ev.Description || ''}</p>
            <div class="event-meta">
              ${ev.Organiser ? `<strong>Organiser:</strong> ${ev.Organiser}<br>` : ''}
              ${location ? `<strong>Location:</strong> ${location}<br>` : ''}
              ${ev.Format ? `<strong>Format:</strong> ${ev.Format}` : ''}
            </div>
            ${links.length ? `<div class="event-links">${links.join(' · ')}</div>` : ''}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
