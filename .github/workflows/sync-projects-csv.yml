name: Sync Projects CSV from Google Sheets

on:
  schedule:
    # Every 30 minutes (adjust as needed)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download CSV from Google Sheets
        run: |
          curl -L -o assets/data/projects.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTplgMSrVn1kxmsyVD1kEEDCq2xXSwsMJxeMdjPGYWlYspQmRzApvg2DWFK0xko2l55W1ie6H4TARZb/pub?gid=0&single=true&output=csv"

      - name: Commit and push if changed
        run: |
          git config user.name "Beowulf bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/projects.csv
          git diff --staged --quiet || git commit -m "chore: update projects.csv from Google Sheets"
          git push
