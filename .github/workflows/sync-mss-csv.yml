name: Sync MSS CSV from Google Sheets

on:
  schedule:
    # Every 30 minutes (adjust as needed)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download CSV from Google Sheets
        run: |
          curl -L -o assets/data/mss.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWn9yJgHUKNLRHNGZvVnabep93Ovwqg-LK-OVLCt9W7G3NZga6WaMsUhkrNxmE2-qvX-2_IQYWlZ1F/pub?gid=1882942269&single=true&output=csv"

      - name: Commit and push if changed
        run: |
          git config user.name "Bot-varr Bjarki"
          git config user.email "bot-varr-bjarki@users.noreply.github.com"
          git add assets/data/mss.csv
          git diff --staged --quiet || git commit -m "Bot-varr Bjarki's heroic feat: update mss.csv from Google Sheets"
          git push
