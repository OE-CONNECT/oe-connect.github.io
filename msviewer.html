<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript viewer – OE-CONNECT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tify@0.36.2/dist/tify.css">

  <style>
  .tify {
    --tify-bg-color: #F5E8C7;
  }
</style>
  
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
      <header>
      <h1>Manuscript viewer</h1>
      </header>

  <div id="tify" style="height: 80vh; width: 100%;"></div>
    
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import Tify from 'https://cdn.jsdelivr.net/npm/tify@0.36.2/dist/tify.js';

  // Get the manifest from the web address (if present)
  const params = new URLSearchParams(window.location.search);
  const manifest = params.get('manifest') || 'https://digitalcollections.universiteitleiden.nl/iiif_manifest/item:4167709/manifest';

  new Tify({
    container: '#tify',
    manifestUrl: manifest
  });
</script>
