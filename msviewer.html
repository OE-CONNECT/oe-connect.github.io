<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manuscript viewer – OE-CONNECT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tify@0.36.2/dist/tify.css">

  <style>
  .tify {
    --tify-bg-color: #F5E8C7;
     --tify-body-bg: #f8f1e3;
  }

.tify-main {
  border-top: none !important;
  margin-top: 0 !important;
  padding-top: 0 !important;
}

  .tify-header-title {
  display: none !important;
}

/* Normal (non-selected) items */
.tify-page-select-list > li > a {
  background-color: #f0f0f0 !important;   /* light grey */
  color: #222 !important;                 /* black text */
}

.tify-page-select-list > li > a:hover {
  background-color: white !important;
  color: #9c1c2b !important;              /* red text */
}

.tify-page-select-list > li > a.-current {
  background-color: #9c1c2b !important;   /* your red */
  color: white !important;
}

.tify-page-select-list > li > a.-current:hover {
  background-color: #7a1521 !important;
  color: white !important;
}
    
.tify a {
  color: #9c1c2b !important;
}

.tify a:hover {
  color: #7a1521 !important;
}
    
.tify-media-button,
.tify-media-dropdown > .tify-dropdown-button {
  background-color: #9c1c2b !important;
  color: white !important;
}

.tify-media-button:hover,
.tify-media-dropdown > .tify-dropdown-button:hover {
  background-color: #7a1521 !important;
}

.tify-media-button:hover {
  background-color: #7a1521 !important;
}

.tify-thumbnails-item.-current .tify-thumbnails-button,
.tify-thumbnails-item.-current {
  box-shadow: 0 0 0 3px #9c1c2b !important; 
}

.tify-thumbnails-item.-current .tify-page-name {
  background-color: #9c1c2b !important;      
  color: white !important;
}

.tify-toc {
  --tify-base-color: #9c1c2b;
}

.tify-toc-toggle,
.tify-toc-toggle-all {
  color: inherit !important;
  border-color: currentColor !important;
  background: none !important;
}

.tify-header {
  border-bottom: none !important;
  box-shadow: none !important;
}
    
</style>
  
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
      <header>
      <h1>Facsimile viewer</h1>
      </header>
    
<h2 id="manuscript-title">Loading facsimile…</h2>
  <div id="tify" style="height: 80vh; width: 100%;"></div>
    
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import Tify from 'https://cdn.jsdelivr.net/npm/tify@0.36.2/dist/tify.js';

  const params = new URLSearchParams(window.location.search);
  const manifest = params.get('manifest') || 'https://digitalcollections.universiteitleiden.nl/iiif_manifest/item:4167709/manifest';
  const title = params.get('title') || 'Leiden, Leiden University Libraries, VLQ 106'; 
  document.getElementById('manuscript-title').textContent = 'Viewing ' + title;
  
new Tify({
  container: '#tify',
  manifestUrl: manifest,
  urlQueryKey: 'tify',
  urlQueryParams: ['pages', 'pan', 'zoom'] 
});
</script>
